# Build NetProbe.exe on Windows and publish a GitHub release.
# Runs when docs/releases/*.md changes on main (or by hand from the Actions tab).
# Tag = "v" + MainForm.Version; release text = docs/releases/<tag>.md
# (first line is the release title, the rest is the description).
# If the release for that version already exists, nothing is published.
name: Release

on:
  push:
    branches: [main]
    paths: ['docs/releases/*.md', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find version
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -oP 'Version = "\K[0-9.]+' src/MainForm.cs)
          tag="v$v"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, skipping"; echo "skip=1" >> "$GITHUB_OUTPUT"
          elif [ ! -f "docs/releases/$tag.md" ]; then
            echo "No docs/releases/$tag.md, skipping"; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.ver.outputs.skip != '1'
        shell: cmd
        run: call src\build.cmd

      - name: Publish release
        if: steps.ver.outputs.skip != '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          test -f NetProbe.exe || { echo "NetProbe.exe was not built"; exit 1; }
          notes="docs/releases/$TAG.md"
          title=$(head -n 1 "$notes")
          tail -n +2 "$notes" > body.md
          gh release create "$TAG" NetProbe.exe --target "$GITHUB_SHA" --title "$title" --notes-file body.md
