# Build NetProbe.exe on Windows and publish a GitHub release.
# Runs when docs/releases/*.md changes on main (or by hand from the Actions tab).
# Tag = "v" + MainForm.Version; release text = docs/releases/<tag>.md
# (first line is the release title, the rest is the description).
# - no release for that tag yet          -> create it (author: github-actions) with NetProbe.exe
# - a draft for that tag already exists  -> attach NetProbe.exe to it and publish it (author stays whoever made the draft)
# - a published release with NetProbe.exe already exists -> nothing to do
name: Release

on:
  push:
    branches: [main]
    paths: ['docs/releases/*.md', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find version
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -oP 'Version = "\K[0-9.]+' src/MainForm.cs)
          tag="v$v"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # drafts have no tag yet, so look them up by tag_name in the list
          info=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" --jq ".[] | select(.tag_name==\"$tag\") | [.id, .draft, ([.assets[].name] | index(\"NetProbe.exe\") != null)] | @tsv" | head -n 1)
          if [ -z "$info" ]; then
            if [ -f "docs/releases/$tag.md" ]; then echo "mode=create" >> "$GITHUB_OUTPUT"; else echo "No docs/releases/$tag.md, skipping"; echo "mode=skip" >> "$GITHUB_OUTPUT"; fi
          else
            id=$(echo "$info" | cut -f1); draft=$(echo "$info" | cut -f2); hasexe=$(echo "$info" | cut -f3)
            echo "id=$id" >> "$GITHUB_OUTPUT"
            if [ "$draft" = "true" ]; then echo "mode=fill" >> "$GITHUB_OUTPUT";
            elif [ "$hasexe" = "true" ]; then echo "Release $tag already published with NetProbe.exe, skipping"; echo "mode=skip" >> "$GITHUB_OUTPUT";
            else echo "mode=upload" >> "$GITHUB_OUTPUT"; fi
          fi

      - name: Build
        if: steps.ver.outputs.mode != 'skip'
        shell: cmd
        run: call src\build.cmd

      - name: Publish release
        if: steps.ver.outputs.mode != 'skip'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          MODE: ${{ steps.ver.outputs.mode }}
          RID: ${{ steps.ver.outputs.id }}
        run: |
          test -f NetProbe.exe || { echo "NetProbe.exe was not built"; exit 1; }
          if [ "$MODE" = "create" ]; then
            notes="docs/releases/$TAG.md"
            title=$(head -n 1 "$notes")
            tail -n +2 "$notes" > body.md
            gh release create "$TAG" NetProbe.exe --target "$GITHUB_SHA" --title "$title" --notes-file body.md
            exit 0
          fi
          # draft or published release without the exe: attach the build
          gh api -X POST -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=NetProbe.exe" \
            --input NetProbe.exe > /dev/null
          if [ "$MODE" = "fill" ]; then
            # publish the draft on this commit; title / description are kept as written in the draft
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RID" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -F draft=false -f make_latest=true > /dev/null
          fi
