# Build NetProbe.exe on Windows and publish a GitHub release when a vX.Y.Z tag is pushed.
# Release text: docs/releases/<tag>.md — first line is the release title, the rest is the description.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: call src\build.cmd

      - name: Check build output and version
        shell: bash
        run: |
          test -f NetProbe.exe || { echo "NetProbe.exe was not built"; exit 1; }
          v=$(grep -oP 'Version = "\K[0-9.]+' src/MainForm.cs)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "MainForm.Version $v does not match tag $GITHUB_REF_NAME"; exit 1; }

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          test -f "$notes" || { echo "Missing $notes"; exit 1; }
          title=$(head -n 1 "$notes")
          tail -n +2 "$notes" > body.md
          gh release create "$GITHUB_REF_NAME" NetProbe.exe --title "$title" --notes-file body.md
